name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  # build ตรวจสอบทุก pull request ก่อน merge เสมอ — ให้เห็นว่า compile ผ่านจริงก่อนไปโผล่บน main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artifact, for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: music-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # ปล่อย release เฉพาะตอน push ไป main เท่านั้น — ถ้าปล่อยจาก PR ด้วย แอปของผู้ใช้ที่เปิด
      # auto-update จะเห็น "เวอร์ชันใหม่" ที่ยังไม่ผ่านการ merge/review ทันที
      - name: Publish GitHub Release (for in-app auto-update)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Auto-built from commit ${{ github.sha }}"
