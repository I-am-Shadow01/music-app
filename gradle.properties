org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# เวอร์ชัน NewPipeExtractor ที่ใช้จริงตอนนี้ — .github/workflows/update-newpipe.yml
# จะเช็คเวอร์ชันล่าสุดจาก GitHub ให้เองทุกวัน แล้วอัปเดตบรรทัดนี้อัตโนมัติเมื่อมีของใหม่กว่า
newpipeExtractorVersion=v0.26.5

# Regression tests executed by build.yml
junitVersion=4.13.2

# Android 16 (API 36) — แอปนี้ใช้เองบน Android 16 เท่านั้น จึงตั้ง minSdk = targetSdk = compileSdk
# (ไม่ต้องมี core library desugaring และ branch เช็ก SDK_INT อีกต่อไป)
androidCompileSdk=36
androidTargetSdk=36
androidMinSdk=36

# Compose BOM — ตั้งใจไม่ใช้ BOM ล่าสุด: เอกสารทางการระบุว่า Compose 1.12 ต้องใช้ compileSdk 37 + AGP 9
# ซึ่งเกินที่ AGP 8.13 รองรับ (สูงสุด API 36.1) — ถ้าอยากขึ้น BOM ใหม่กว่านี้ต้องขึ้น AGP ก่อน
composeBomVersion=2025.12.01

# Media3 — 1.11.x ล่าสุดที่ stable (เฟส 0b); ทุกโมดูล media3 ต้องเวอร์ชันเดียวกันเสมอ
media3Version=1.11.1

# navigation-compose — 2.9.8 คือรุ่นสุดท้ายก่อน 2.10 ที่เอกสารระบุว่าย้าย Compose ไป compileSdk 37 (ต้อง AGP 9.2+)
# 2.8+ มี predictive back ภายในแอปมาให้ (SeekableTransitionState)
navigationComposeVersion=2.9.8
